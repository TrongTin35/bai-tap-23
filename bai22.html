<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả Bài 22</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
        }

        .container {
            margin: 30px auto;
            padding: 20px;
            max-width: 900px;
            background-color: white;
            border-radius: 10px;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 2px solid #007bff;
            border-radius: 8px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>KẾT QUẢ BÀI TẬP 22</h1>
    </header>

    <main class="container">
        <h2>Hình ảnh kết quả Bài 22</h2>

        <p>
            Dưới đây là hình ảnh kết quả thực hiện
            bài tập Đèn kéo quân bằng JavaScript.
        </p>

        <img src="anh-bai22.png"
             alt="Hình ảnh kết quả Bài 22">

        <br>

        <a href="index.html">Về trang chủ</a>
    </main>

</body>
</html>
